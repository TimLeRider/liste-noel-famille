<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14342b">
  <meta name="description" content="La liste de Noël de la famille : idées de cadeaux, votes secrets et révélation le 5 décembre.">
  <title>Liste de Noël Familiale</title>

  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Noël">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Barre supérieure : marque + compte à rebours de clôture des votes -->
  <header class="topbar">
    <a href="#/" class="brand"><span aria-hidden="true">🎄</span> Liste de Noël</a>
    <span id="phase-chip" class="phase-chip" hidden></span>
  </header>

  <!-- Vue courante (rendue par app.js selon l'adresse #/…) -->
  <main id="view" class="container">
    <div class="center-screen"><div class="spinner" aria-label="Chargement"></div></div>
  </main>

  <!-- Navigation : barre basse sur mobile, intégrée en haut sur ordinateur -->
  <nav id="nav" class="bottom-nav" aria-label="Navigation principale" hidden></nav>

  <noscript><p class="container">Cette application nécessite JavaScript.</p></noscript>

  <!-- Chargement de l'application ; message clair si la configuration manque -->
  <script type="module">
    import('./app.js').catch((err) => {
      console.error(err);
      const msg = String(err?.message || err).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c]);
      document.getElementById('view').innerHTML =
        `<div class="card narrow"><h1>Impossible de démarrer</h1><p>${msg}</p></div>`;
    });
  </script>
</body>
</html>
